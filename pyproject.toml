[project]
name = "tax-bridge-mcp"
version = "0.1.0"
description = "Tax filing + e-invoicing bridge to ONE OS — parse, validate, map, govern (UK MTD / EU ViDA / OECD BEPS / IRS). CSOAI Layer-0 legacy-bridge family."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CSOAI-ORG"}]
dependencies = ["mcp>=2.0.0", "pydantic>=2.0.0"]
[project.scripts]
tax-bridge-mcp = "server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
only-include = ["server.py", "mcp2026_shim.py"]
